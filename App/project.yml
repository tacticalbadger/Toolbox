name: Toolbox
options:
  bundleIdPrefix: com.dobbs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.3
  RoyalVNCKit:
    url: https://github.com/royalapplications/royalvnc
    revision: 92d4427c73817d8f849bb289ff190aa4b40c44ea
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Toolbox:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: SwiftTerm
      - package: RoyalVNCKit
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        CFBundleName: Toolbox
        CFBundleDisplayName: Toolbox
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSHumanReadableCopyright: ""
        # Over-the-air updates. Keep in step with bridge/update-config.sh,
        # which is where `make app` and `make release` take these from.
        SUFeedURL: "https://github.com/tacticalbadger/Toolbox/releases/latest/download/appcast.xml"
        SUPublicEDKey: "h2Ue9u/hwW6kZp5iTEZ6aZBh5jzWhsn/CZe+laVMknw="
        SUEnableAutomaticChecks: true
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        # Shown when macOS asks whether the app may read a protected folder.
        NSDesktopFolderUsageDescription: "Toolbox reads files here when you paste them into a remote desktop, transfer them to a server, or work with them in a local terminal."
        NSDocumentsFolderUsageDescription: "Toolbox reads files here when you paste them into a remote desktop, transfer them to a server, or work with them in a local terminal."
        NSDownloadsFolderUsageDescription: "Toolbox reads files here when you paste them into a remote desktop, transfer them to a server, or work with them in a local terminal."
        NSRemovableVolumesUsageDescription: "Toolbox reads files here when you paste them into a remote desktop, transfer them to a server, or work with them in a local terminal."
        NSNetworkVolumesUsageDescription: "Toolbox reads files here when you paste them into a remote desktop, transfer them to a server, or work with them in a local terminal."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dobbs.Toolbox
        PRODUCT_NAME: Toolbox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Rust core: produced by bridge/build-core.sh
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/ToolboxCoreFFI
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor
        OTHER_LDFLAGS: ["-ltoolbox_core", "-framework", "Security", "-framework", "SystemConfiguration", "-framework", "CoreFoundation", "-framework", "IOSurface", "-framework", "CoreMedia", "-framework", "CoreVideo", "-framework", "VideoToolbox"]
